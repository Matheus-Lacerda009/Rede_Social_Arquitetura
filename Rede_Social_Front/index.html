<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conecta - Rede Social</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header id="nav" hidden>
        <a class="logo" href="#/feed">Conecta</a>
        <form id="bs" class="busca"><input placeholder="Ir para um perfil (digite o ID)" inputmode="numeric" aria-label="Buscar perfil por ID"></form>
        <nav>
            <a href="#/feed" title="Início"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg></a>
            <a href="#/chat" title="Mensagens"><svg viewBox="0 0 24 24"><path d="M21 12a8.5 8.5 0 0 1-12.2 7.6L3 21l1.5-5.4A8.5 8.5 0 1 1 21 12z"/></svg></a>
            <button id="novo" class="ib" title="Publicar"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg></button>
            <a id="eu" href="#/perfil" title="Perfil"></a>
            <button data-sair class="ib" title="Sair"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
        </nav>
    </header>
    <main id="app"></main>
    <div id="toast"></div>
    <script src="js/app.js"></script>
</body>
</html>
